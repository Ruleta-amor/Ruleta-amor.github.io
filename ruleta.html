<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Hoy debería...</title>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&display=swap" rel="stylesheet">
<style>
:root {
  --fondo: #0e0a15;
  --morado: #6d3fc9;
  --morado-oscuro: #3b1f78;
  --lila: #cdbcf5;
  color-scheme: dark;
  padding-top: env(safe-area-inset-top, 0px);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
* { box-sizing: border-box; margin: 0; }
html, body { height: 100%; }
body {
  background: var(--fondo);
  color: var(--lila);
  font-family: "Caveat", "Segoe Script", "Comic Sans MS", cursive;
  display: flex;
  align-items: center;
  justify-content: center;
  text-align: center;
  overflow-x: hidden;
}
.estrella {
  position: fixed;
  color: var(--morado);
  font-size: 1.6rem;
  user-select: none;
}
main {
  width: min(90vw, 460px);
  padding: 1.5rem 0;
}
h1 {
  font-size: clamp(3rem, 13vw, 4.8rem);
  font-weight: 700;
  color: var(--lila);
  margin-bottom: 1.4rem;
}
.caja {
  border: 3px solid var(--morado);
  border-radius: 255px 18px 225px 18px / 18px 225px 18px 255px;
  padding: 2.2rem 1.4rem;
  min-height: 9.5rem;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #170f26;
  transform: rotate(1deg);
}
#idea {
  font-size: clamp(1.9rem, 7vw, 2.4rem);
  line-height: 1.15;
  color: #fff;
}
#idea.vacia { color: #8a79b8; }
button {
  margin-top: 1.8rem;
  font-family: inherit;
  font-size: 1.6rem;
  font-weight: 700;
  color: #fff;
  background: var(--morado);
  border: 3px solid var(--lila);
  border-radius: 30px 12px 30px 12px;
  padding: 0.35rem 1.8rem 0.45rem;
  cursor: pointer;
}
button:hover { background: #7e51dd; }
button:active { background: var(--morado-oscuro); }
button:disabled { background: var(--morado-oscuro); cursor: wait; }
button:focus-visible { outline: 3px dashed var(--lila); outline-offset: 4px; }
.firma {
  margin-top: 2rem;
  font-size: 1.3rem;
  color: #7d6bab;
}
</style>
</head>
<body>
<span class="estrella" style="top:8%;left:9%;transform:rotate(-12deg)">✦</span>
<span class="estrella" style="top:14%;right:11%;font-size:1rem">✦</span>
<span class="estrella" style="bottom:18%;left:14%;font-size:1.1rem;transform:rotate(20deg)">✦</span>
<span class="estrella" style="bottom:9%;right:8%;transform:rotate(8deg)">✦</span>
<span class="estrella" style="top:46%;right:4%;font-size:0.9rem">✦</span>

<main>
  <h1>Hoy debería...</h1>
  <div class="caja">
    <p id="idea" class="vacia">Dale click al boton amorcin</p>
  </div>
  <button id="boton">Girar</button>
  <p class="firma">Te amo mucho mi amorcito, aqui tienes algunas ideas mi vida, recuerda si sacas el token avisarme.</p>
</main>

<script>
const ideas = [
  "Dibujar a mis OC",
  "Probar un nuevo pincel",
  "Dibujarle algo a mi novio",
  "Colorear algo",
  "Probar una nueva técnica",
  "Hacer un boceto de 5 minutos",
  "Dibujar lo primero que vea",
  "Redibujar un dibujo viejo",
  "Probar una paleta de colores nueva",
  "Dibujar mi comida favorita",
  "Hacer un fanart",
  "Dibujar con la mano que no uso",
  "Diseñarle un outfit nuevo a un OC",
  "Dibujar un paisaje de noche",
  "Dibujar sin levantar el lápiz",
  "Practicar manos",
  "Dibujar una mascota inventada",
  "Hacer un dibujo con solo tres colores",
  "Dibujar algo que me dé miedo",
  "Probar un sombreado distinto",
  "Inventar una criatura",
  "Hacer stickers",
  "Hacerme un autorretrato",
  "Diseñar la portada de una historia",
  "Dibujar mi lugar favorito",
  "Hacer un dibujo en miniatura",
  "Dibujar a mis OC juntos",
  "Dibujar flores moradas",
  "Probar lineart con tinta",
  "Dibujar escuchando mi música favorita",
  "Crear un personaje al azar",
  "Dibujar un gatito",
  "Dibujar una escena de ensueño",
  "Descansar y buscar referencias bonitas"
];

const idea = document.getElementById("idea");
const boton = document.getElementById("boton");
let actual = -1;

function otra() {
  let n;
  do {
    n = Math.floor(Math.random() * ideas.length);
  } while (n === actual);
  actual = n;
  return ideas[n];
}

boton.addEventListener("click", () => {
  boton.disabled = true;
  idea.classList.remove("vacia");
  let vueltas = 0;
  const total = 20 + Math.floor(Math.random() * 8);

  function girar() {
    idea.textContent = otra();
    vueltas++;
    if (vueltas >= total) {
      boton.disabled = false;
      boton.textContent = "Otra vez";
      return;
    }
    setTimeout(girar, 60 + vueltas * vueltas * 0.5);
  }

  girar();
}
);
</script>
</body>
</html>
